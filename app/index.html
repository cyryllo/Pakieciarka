<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pakieciarka</title>
    <meta name="description" content="Konfigurator pakietów akumulatorów 18650/21700 z generatorem G-code dla zgrzewarki" />
    <link data-trunk rel="icon" href="assets/pakieciarka.svg" />
    <link data-trunk rel="rust" data-bin="pakieciarka" data-wasm-opt="2"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1b1b; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #loading_text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: system-ui, sans-serif; color: #ccc; font-size: 18px; }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text">Ładowanie Pakieciarki…</div>
</body>
</html>
