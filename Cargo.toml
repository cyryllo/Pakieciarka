[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
